[project]
name = "ocbot"
version = "0.1.0"
description = "Telegram control panel for OpenCode"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.32",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: talks to the real local OpenCode server (OCBOT_LIVE=1)",
]
filterwarnings = ["error::DeprecationWarning:ocbot.*"]
